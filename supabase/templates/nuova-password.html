<h2>Scegli una nuova password</h2>
<p>Hai chiesto di cambiare la password del tuo account FamilyNest.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
    >Scegli una nuova password</a
  >
</p>
<p>
  Il link vale un'ora e si usa una volta sola. Se non l'hai chiesto tu, ignora
  questa mail: la tua password resta quella di prima.
</p>
