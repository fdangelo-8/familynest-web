# Database pipeline.
# - On every pull request that changes more than docs/** and *.md files: start a
#   throwaway local Postgres, apply ALL migrations from scratch, run pgTAP tests,
#   and check generated types are committed.
# - On push to main: apply new migrations to the FamilyNest Supabase project.
#   The connection string lives only in the SUPABASE_DB_URL GitHub secret:
#   no agent ever holds database credentials.
name: db

on:
  # Runs on every pull request because `db` is a required check: a pull request
  # that changes only docs/** and *.md files gets a quick success instead of no run.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  # Changed files of the pull request.
  pull-requests: read
  # Job durations in the run summary.
  actions: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  db:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Documentation alone cannot change the database: the remaining steps are skipped.
      - name: Detect documentation-only changes
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/files.txt"
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > "$files"
          if awk '/^docs\// || /\.md$/ { next } { print }' "$files" | grep -q .; then
            echo "only=false" >> "$GITHUB_OUTPUT"
          else
            echo "only=true" >> "$GITHUB_OUTPUT"
            echo "Solo documentazione: controlli database saltati." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.docs.outputs.only != 'true'
      - uses: actions/setup-node@v4
        if: steps.docs.outputs.only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.docs.outputs.only != 'true'

      - name: Count migrations
        id: mig
        if: steps.docs.outputs.only != 'true'
        run: echo "count=$(find supabase/migrations -name '*.sql' 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # The runner sometimes still holds the database port: retry once after a clean stop.
      - name: Start local database and apply all migrations
        if: steps.docs.outputs.only != 'true' && steps.mig.outputs.count != '0'
        run: npx supabase db start || { sleep 15; npx supabase stop --no-backup; npx supabase db start; }

      - name: Run pgTAP tests
        if: steps.docs.outputs.only != 'true' && steps.mig.outputs.count != '0'
        run: |
          if find supabase/tests -name '*.sql' 2>/dev/null | grep -q .; then
            npx supabase test db
          else
            echo "::error::Ci sono migrazioni ma nessun test pgTAP in supabase/tests/. Ogni tabella richiede test di isolamento RLS."
            exit 1
          fi

      - name: Check generated types are up to date
        if: steps.docs.outputs.only != 'true' && steps.mig.outputs.count != '0'
        run: |
          set -o pipefail
          # Same output as `npm run db:types:local`: Prettier resolves the project config from the real path.
          npx supabase gen types typescript --local --schema public \
            | npx prettier --stdin-filepath src/types/database.ts > /tmp/database.ts
          if ! diff -u src/types/database.ts /tmp/database.ts > /tmp/types.diff; then
            echo "::error::src/types/database.ts non corrisponde allo schema. Scarica l'artifact 'expected-database-types' e sostituisci il file."
            cat /tmp/types.diff | head -200
            exit 1
          fi

      - name: Upload expected types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expected-database-types
          path: /tmp/database.ts
          if-no-files-found: ignore

      - name: No migrations yet
        if: steps.mig.outputs.count == '0'
        run: |
          echo "Nessuna migrazione ancora presente, controlli database saltati."

      - uses: ./.github/actions/job-duration
        if: always()
        continue-on-error: true
        with:
          job: ${{ github.job }}
          token: ${{ github.token }}

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations to yksosqvugiempsldejyt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if ! find supabase/migrations -name '*.sql' 2>/dev/null | grep -q .; then
            echo "Nessuna migrazione da applicare."; exit 0
          fi
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL mancante: le migrazioni non sono state applicate."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *yksosqvugiempsldejyt*) ;;
            *) echo "::error::SUPABASE_DB_URL non punta al progetto yksosqvugiempsldejyt."; exit 1 ;;
          esac
          npx supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      - uses: ./.github/actions/job-duration
        if: always()
        continue-on-error: true
        with:
          job: ${{ github.job }}
          token: ${{ github.token }}
