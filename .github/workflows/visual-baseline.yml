# Generates visual baseline screenshots in the same Playwright container used by CI,
# so pixels match. Triggered manually (or by the visual tester agent) on a work branch.
# It never commits: it uploads the screenshots as an artifact that the agent reviews and commits.
name: visual-baseline

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec files or folders to run, space separated (default: all of tests/visual)"
        required: false
        default: "tests/visual"
      update:
        description: "changed = rewrite only failing references; all = rewrite every reference of the selected specs (needed when a change is under the 2% tolerance)"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read

jobs:
  baseline:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same setup as the CI test job: a throwaway local Supabase with migrations,
    # seed and test users created for this run. The remote project is never touched.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check inputs
        env:
          SPEC: ${{ inputs.spec || 'tests/visual' }}
        run: |
          # Only paths under tests/visual are accepted.
          for p in $SPEC; do
            case "$p" in
              tests/visual|tests/visual/*) ;;
              *) echo "::error::spec must be under tests/visual: $p"; exit 1 ;;
            esac
            case "$p" in *[!A-Za-z0-9._/-]*) echo "::error::invalid characters in spec: $p"; exit 1 ;; esac
          done

      - name: Start throwaway Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Create local test users
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          case "$API_URL" in
            http://127.0.0.1:*) ;;
            *) echo "::error::Supabase locale non trovato."; exit 1 ;;
          esac
          env_file="$RUNNER_TEMP/test.env"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } > "$env_file"
          for key in A B B2 C; do
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            {
              echo "TEST_USER_${key}_EMAIL=ci-$(echo "$key" | tr '[:upper:]' '[:lower:]')@example.test"
              echo "TEST_USER_${key}_PASSWORD=$password"
            } >> "$env_file"
          done
          set -a
          . "$env_file"
          set +a
          node scripts/seed-test-users.ts

      - name: Read pinned Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Update snapshots inside the official Playwright container
        env:
          SPEC: ${{ inputs.spec || 'tests/visual' }}
          UPDATE: ${{ inputs.update || 'changed' }}
        run: |
          docker run --rm --network host --ipc host \
            --env-file "$RUNNER_TEMP/test.env" -e CI=true -e SPEC -e UPDATE \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            "mcr.microsoft.com/playwright:v${{ steps.pw.outputs.version }}-noble" \
            bash -c 'npx playwright test $SPEC --update-snapshots=$UPDATE'

      # Upload even when unrelated specs fail, so the references of the passing ones are not lost.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          if-no-files-found: error
