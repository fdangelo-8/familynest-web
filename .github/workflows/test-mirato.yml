# Runs a few Playwright spec files on a work branch, on demand, with a throwaway
# local Supabase (same setup as the CI test job). Lets the developer run the
# accessibility and e2e tests of a page before opening the pull request, without
# the in-test label and without the full suite. It never commits anything.
#   gh workflow run test-mirato --ref <branch> -f spec="tests/a11y/x.spec.ts tests/e2e/x.spec.ts"
name: test-mirato

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec files or folders inside tests/e2e, tests/a11y or tests/visual, space separated"
        required: true

permissions:
  contents: read

concurrency:
  # One group per branch and spec list: two testers running different specs on
  # the same branch no longer cancel each other; repeating the same specs still
  # replaces the older run.
  group: test-mirato-${{ github.ref }}-${{ inputs.spec }}
  cancel-in-progress: true

jobs:
  # Not named "test": a check with the same name as the CI test job would
  # shadow it in pr-checks and make a failed full suite look green.
  test-mirato:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check inputs
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          [ -n "$SPEC" ] || { echo "::error::spec is required"; exit 1; }
          for p in $SPEC; do
            case "$p" in
              tests/e2e/*|tests/a11y/*|tests/visual/*) ;;
              *) echo "::error::spec must be inside tests/e2e, tests/a11y or tests/visual: $p"; exit 1 ;;
            esac
            case "$p" in *[!A-Za-z0-9._/-]*) echo "::error::invalid characters in spec: $p"; exit 1 ;; esac
          done

      - name: Start throwaway Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      # Same as the CI test job: local URL and keys, and test users with passwords
      # generated for this run. Nothing comes from secrets.
      - name: Create local test users
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          case "$API_URL" in
            http://127.0.0.1:*) ;;
            *) echo "::error::Supabase locale non trovato."; exit 1 ;;
          esac
          env_file="$RUNNER_TEMP/test.env"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } > "$env_file"
          for key in A B B2 C; do
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            {
              echo "TEST_USER_${key}_EMAIL=ci-$(echo "$key" | tr '[:upper:]' '[:lower:]')@example.test"
              echo "TEST_USER_${key}_PASSWORD=$password"
            } >> "$env_file"
          done
          set -a
          . "$env_file"
          set +a
          node scripts/seed-test-users.ts

      - name: Read pinned Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      # Same image as CI and the visual references, so results match.
      - name: Playwright
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          docker run --rm --network host --ipc host \
            --env-file "$RUNNER_TEMP/test.env" -e CI=true -e SPEC \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            "mcr.microsoft.com/playwright:v${{ steps.pw.outputs.version }}-noble" \
            bash -c 'npx playwright test $SPEC'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
