name: CI

# Runs on pull requests and on main only: a push to a branch with an open pull
# request is covered by the pull_request run, so it never runs twice.
#
# To save Actions minutes the Playwright suite (the `test` job, about 20 minutes)
# runs on a pull request only while it has the `in-test` or `pronta-per-francesco`
# label; before that a push runs only `check` and `build`, and agents run the suites
# locally. The labels are read when the run starts, so after adding `in-test` to a
# pull request with no new push, re-running its latest CI run starts the suite.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push cancels the run still in progress for the same pull request or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Changed files of the pull request.
  pull-requests: read
  # Job durations in the run summary.
  actions: read

env:
  # Optional: when the secrets are not set these are empty and nothing fails.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
      visual: ${{ steps.changes.outputs.visual }}
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      # Decides which of the heavier jobs are needed, here to avoid paying for an extra job.
      # On main everything runs. On a pull request:
      # - app: build and Playwright tests, skipped when only docs/** (except docs/mockup/,
      #   which the tests read) or *.md files change;
      # - visual: visual tests, only when something they render or depend on changes.
      # - tests: Playwright suite, only while the pull request is in-test or pronta-per-francesco.
      - name: Detect changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "visual=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Current labels, not the ones in the event: a re-run sees a label added later.
          tests=false
          if gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' | grep -Eqx 'in-test|pronta-per-francesco'; then
            tests=true
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          files="$RUNNER_TEMP/files.txt"
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > "$files"
          echo "File modificati:"; cat "$files"

          app=false
          if awk '/^docs\/mockup\// { print; next } /^docs\// || /\.md$/ { next } { print }' "$files" | grep -q .; then
            app=true
          fi
          visual=false
          if grep -Eq '^(src/|tests/visual/|tests/fixtures/|public/|package(-lock)?\.json$|playwright\.config\.|next\.config\.|\.github/workflows/ci\.yml$|\.github/actions/)|\.css$' "$files"; then
            visual=true
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "visual=$visual" >> "$GITHUB_OUTPUT"
          {
            echo "Build e test Playwright: $([ "$app" = true ] && echo "sì" || echo "no, solo documentazione")"
            echo ""
            echo "Test visivi: $([ "$visual" = true ] && echo "sì" || echo "no, nessun file visivo cambiato")"
            echo ""
            echo "Suite Playwright: $([ "$tests" = true ] && echo "sì" || echo "no, la PR non è ancora in-test")"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run hooks:test
      - run: npm run check
      - uses: ./.github/actions/job-duration
        if: always()
        continue-on-error: true
        with:
          job: ${{ github.job }}
          token: ${{ github.token }}

  build:
    needs: check
    if: needs.check.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/job-duration
        if: always()
        continue-on-error: true
        with:
          job: ${{ github.job }}
          token: ${{ github.token }}

  test:
    needs: [check, build]
    if: needs.check.outputs.app == 'true' && needs.check.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Each run has its own throwaway local Supabase: migrations, seed and test
    # users are created here and discarded with the runner. Runs of different
    # pull requests share no data, so they need no queue, and the tests never
    # touch the remote project.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Start throwaway Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      # Local URL and keys, and test users with passwords generated for this run,
      # written to a file for the Playwright container. Nothing comes from secrets.
      - name: Create local test users
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          case "$API_URL" in
            http://127.0.0.1:*) ;;
            *) echo "::error::Supabase locale non trovato."; exit 1 ;;
          esac
          env_file="$RUNNER_TEMP/test.env"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } > "$env_file"
          for key in A B B2 C; do
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            {
              echo "TEST_USER_${key}_EMAIL=ci-$(echo "$key" | tr '[:upper:]' '[:lower:]')@example.test"
              echo "TEST_USER_${key}_PASSWORD=$password"
            } >> "$env_file"
          done
          # The file overrides the workflow-level variables, which point to the remote project.
          set -a
          . "$env_file"
          set +a
          node scripts/seed-test-users.ts

      # Same image as the visual references, so screenshots render the same way.
      # Keep in sync with the @playwright/test version in package.json.
      # One Playwright run for all suites, so the app is built once.
      - name: Playwright
        run: |
          docker run --rm --network host --ipc host \
            --env-file "$RUNNER_TEMP/test.env" -e CI=true \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            npx playwright test tests/e2e tests/a11y ${{ needs.check.outputs.visual == 'true' && 'tests/visual' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: ./.github/actions/job-duration
        if: always()
        continue-on-error: true
        with:
          job: ${{ github.job }}
          token: ${{ github.token }}
